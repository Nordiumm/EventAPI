name: Publish EventAPI

on:
  release:
    types: [published]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish Maven repository
        run: ./gradlew publishMavenJavaPublicationToMavenLocal

      - name: Prepare Maven repository
        run: |
          mkdir -p pages/net/nordiumm/nixon-event-api

          cp -r ~/.m2/repository/net/nordiumm/nixon-event-api/* \
            pages/net/nordiumm/nixon-event-api/

          cat > pages/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Nordiumm EventAPI</title>
          </head>
          <body>
            <h1>Nordiumm EventAPI</h1>
            <p>Maven repository for the NixonMC EventAPI.</p>
            <p>
              Repository:
              <code>https://nordiumm.github.io/EventAPI/</code>
            </p>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5